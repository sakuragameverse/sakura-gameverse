<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin - Sakura Gameverse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background-color: #05010a; color: #fff; font-family: sans-serif; padding: 20px; }
    .panel { background: rgba(17, 5, 36, 0.8); border: 1px solid rgba(0, 229, 255, 0.3); padding: 20px; border-radius: 10px; margin-bottom: 20px; max-width: 600px; }
    .input-box { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px; width: 100%; border-radius: 5px; margin-bottom: 10px; box-sizing: border-box; }
    .btn { background: #00e5ff; color: #000; border: none; padding: 10px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-bottom: 10px; }
    .btn:hover { opacity: 0.8; }
    .btn-danger { background: #ff3366; color: #fff; }
  </style>
</head>
<body>

  <h2>Panel de Control Multiverso 🗿</h2>

  <!-- SECCIÓN FORJA RPG -->
  <div class="panel">
    <h3 style="color: #00e5ff; margin-top: 0;"><i class="fas fa-hammer"></i> Forja de Objetos RPG</h3>
    <p style="font-size: 0.85em; color: #aaa;">Crea armas, materiales o consumibles para la base de datos.</p>
    
    <input type="text" id="rpgItemNombre" class="input-box" placeholder="Nombre del Objeto (Ej: Espada de Fuego)">
    
    <div style="display: flex; gap: 10px;">
      <select id="rpgItemTipo" class="input-box">
        <option value="arma">Arma / Equipamiento</option>
        <option value="material">Material de Crafteo</option>
        <option value="consumible">Consumible (Poción)</option>
      </select>
      <select id="rpgItemRareza" class="input-box">
        <option value="N">Común (N)</option>
        <option value="R">Raro (R)</option>
        <option value="SR">Épico (SR)</option>
        <option value="SSR">Legendario (SSR)</option>
      </select>
    </div>

    <div style="display: flex; gap: 10px;">
      <input type="number" id="rpgItemAtk" class="input-box" placeholder="+ Ataque (Ej: 15)">
      <input type="number" id="rpgItemDef" class="input-box" placeholder="+ Defensa (Ej: 5)">
    </div>
    
    <button onclick="guardarObjetoRPG()" class="btn"><i class="fas fa-save"></i> Crear Objeto en el Servidor</button>
  </div>

  <!-- SECCIÓN RUMBLE ROYALE -->
  <div class="panel" style="border-color: #ff3366;">
    <h3 style="color: #ff3366; margin-top: 0;"><i class="fas fa-skull-crossbones"></i> Torneo Rumble Royale</h3>
    <p style="font-size: 0.85em; color: #aaa;">Inicia el evento multijugador. Tomará a todos los inscritos actuales y narrará una batalla a muerte.</p>
    <button onclick="ejecutarTorneoRumble()" class="btn btn-danger"><i class="fas fa-play"></i> INICIAR BATALLA AHORA</button>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDH1DZqaIi5sKRXspXDUWbMUZ4nr5JIy8Q",
    authDomain: "sakura-gameverse.firebaseapp.com",
    projectId: "sakura-gameverse",
    storageBucket: "sakura-gameverse.firebasestorage.app",
    messagingSenderId: "226328425516",
    appId: "1:226328425516:web:8dc11761639228c6120d89"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // LOGICA: CREAR OBJETOS
  window.guardarObjetoRPG = async function() {
    let nombre = document.getElementById('rpgItemNombre').value.trim();
    let tipo = document.getElementById('rpgItemTipo').value;
    let rareza = document.getElementById('rpgItemRareza').value;
    let atk = parseInt(document.getElementById('rpgItemAtk').value) || 0;
    let def = parseInt(document.getElementById('rpgItemDef').value) || 0;

    if(!nombre) return alert("Ponle un nombre al objeto.");

    try {
      await addDoc(collection(db, "rpg_objetos"), {
        nombre: nombre, tipo: tipo, rareza: rareza, stats: { ataque: atk, defensa: def }, timestamp: Date.now()
      });
      alert(`Objeto "${nombre}" forjado y guardado.`);
      document.getElementById('rpgItemNombre').value = "";
    } catch(e) { alert("Error al guardar el objeto."); console.log(e); }
  };

  // LOGICA: EJECUTAR RUMBLE
  window.ejecutarTorneoRumble = async function() {
    const rumbleRef = collection(db, "rumble_inscritos");
    const snapshot = await getDocs(rumbleRef);
    let jugadores = [];
    snapshot.forEach(d => jugadores.push(d.data().tag));

    if(jugadores.length < 2) return alert("Se necesitan al menos 2 jugadores inscritos para iniciar un Rumble.");

    let log = `<div style="color: #ffaa00; margin-bottom: 10px;">¡Comienza el Torneo con ${jugadores.length} tributos!</div>`;
    let eventos = [" eliminó a [V] con una katana.", " empujó a [V] fuera de la zona segura.", " le tiró un caparazón azul a [V].", " emboscó y derrotó a [V].", " hizo equipo temporalmente y luego traicionó a [V]."];
    let vivos = [...jugadores]; let turno = 1;

    while(vivos.length > 1) {
      vivos.sort(() => Math.random() - 0.5);
      let atacante = vivos[0]; let victima = vivos[1]; 
      let accion = eventos[Math.floor(Math.random() * eventos.length)].replace("[V]", `<span style='color:#ff3366'>${victima}</span>`);
      log += `[Día ${turno}] <strong>${atacante}</strong>${accion}<br>`;
      vivos.splice(1, 1); turno++;
    }

    let ganador = vivos[0];
    log += `<br><span style="color: #25d366; font-size: 1.2em;">🏆 ¡${ganador} ES EL GANADOR SUPREMO! 🏆</span><br>Premio enviado por el Administrador.`;

    await setDoc(doc(db, "rumble_historial", "ultimo_torneo"), { ganador: ganador, logHTML: log, fecha: Date.now() });
    snapshot.forEach(async (documento) => { await deleteDoc(doc(db, "rumble_inscritos", documento.id)); });
    alert(`Torneo finalizado con éxito. Ganador: ${ganador}.`);
  };
</script>
</body>
</html>
