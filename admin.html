<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Admin Panel 🌸</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0d041a;
      --card-bg: linear-gradient(135deg, #1a0b38 0%, #11052C 100%);
      --text-color: white;
      --primary-color: #FF007F;
      --secondary-color: #00e5ff;
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: var(--secondary-color);
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }

    .volver-btn {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--text-color);
      text-decoration: none;
      background: rgba(255, 0, 127, 0.2);
      border: 1px solid var(--primary-color);
      padding: 8px 15px;
      border-radius: 10px;
      transition: all 0.3s;
    }
    .volver-btn:hover { background: var(--primary-color); }

    /* SISTEMA DE PESTAÑAS */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }
    .tab-btn {
      background: var(--card-bg);
      border: 2px solid var(--secondary-color);
      color: var(--text-color);
      padding: 10px 25px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.1em;
      transition: all 0.3s;
    }
    .tab-btn.active {
      background: var(--secondary-color);
      color: #0d041a;
      box-shadow: 0 0 15px var(--secondary-color);
    }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.4s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* FORMULARIOS */
    .form-container {
      background: var(--card-bg);
      border: 1px solid var(--secondary-color);
      padding: 20px;
      border-radius: 15px;
      max-width: 600px;
      margin: 0 auto 30px auto;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: var(--secondary-color); font-weight: bold; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      background: var(--bg-color);
      border: 1px solid var(--primary-color);
      color: white;
      border-radius: 8px;
      outline: none;
    }

    .btn-submit {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 0 10px var(--primary-color);
      transition: all 0.3s;
    }
    .btn-submit:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--primary-color); }

    /* LISTAS (Banners y Productos) */
    .grid-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .admin-card {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--primary-color);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      position: relative;
    }
    .admin-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .admin-card h3 { margin: 5px 0; font-size: 1.1em; color: var(--secondary-color); }
    .btn-delete {
      background: #ff3366;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>
<body>

  <a href="index.html" class="volver-btn"><i class="fas fa-arrow-left"></i> Volver a la Tienda</a>
  
  <h1>🛠️ Panel de Control Sakura 🌸</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('productos', this)">📦 Productos</button>
    <button class="tab-btn" onclick="switchTab('banners', this)">🖼️ Banners Promocionales</button>
  </div>

  <div id="tab-productos" class="tab-content active">
    <div class="form-container">
      <h2 style="text-align: center; color: var(--primary-color); margin-top:0;">Añadir Nuevo Producto</h2>
      <form id="formProducto">
        <div class="form-group">
          <label>Nombre del Producto</label>
          <input type="text" id="prodNombre" required placeholder="Ej: Manga Chainsaw Man Vol 1">
        </div>
        <div class="form-group">
          <label>Precio (USD)</label>
          <input type="number" id="prodPrecio" required step="0.01" placeholder="Ej: 15.00">
        </div>
        <div class="form-group">
          <label>Categoría</label>
          <select id="prodCat">
            <option value="mangas">📚 Mangas</option>
            <option value="ropa">👕 Ropa / Hoodies</option>
            <option value="mandos">🎮 Mandos PC</option>
            <option value="teclados">⌨️ Teclados</option>
            <option value="audifonos">🎧 Audífonos</option>
            <option value="figuras">🗿 Figuras</option>
            <option value="peluches">🧸 Peluches</option>
            <option value="cartas">🃏 Cartas TCG</option>
            <option value="katanas">⚔️ Katanas</option>
            <option value="lamparas">💡 Lámparas</option>
          </select>
        </div>
        <div class="form-group">
          <label>Estado / Disponibilidad</label>
          <select id="prodEstado">
            <option value="Envío Inmediato 📦">Envío Inmediato 📦 (Stock)</option>
            <option value="Por Encargo ⚡">Por Encargo ⚡</option>
          </select>
        </div>
        <div class="form-group">
          <label>URLs de las Imágenes (Separadas por comas)</label>
          <textarea id="prodFotos" rows="3" required placeholder="https://link-foto1.jpg, https://link-foto2.jpg"></textarea>
        </div>
        <button type="submit" class="btn-submit"><i class="fas fa-cloud-upload-alt"></i> Subir a la Nube</button>
      </form>
    </div>

    <h2 style="text-align: center;">📦 Inventario Actual</h2>
    <div id="listaProductos" class="grid-list">Cargando productos...</div>
  </div>

  <div id="tab-banners" class="tab-content">
    <div class="form-container" style="border-color: #ff9900; box-shadow: 0 0 20px rgba(255, 153, 0, 0.2);">
      <h2 style="text-align: center; color: #ff9900; margin-top:0;">Añadir Nuevo Banner</h2>
      <p style="text-align: center; font-size: 0.9em; opacity: 0.8;">Agrega las imágenes que rotarán en el carrusel principal del inicio.</p>
      <form id="formBanner">
        <div class="form-group">
          <label style="color: #ff9900;">URL de la Imagen del Banner</label>
          <input type="url" id="bannerImg" required placeholder="https://mi-imagen.com/banner1.jpg">
        </div>
        <div class="form-group">
          <label style="color: #ff9900;">URL de Enlace (Opcional)</label>
          <input type="url" id="bannerLink" placeholder="¿A dónde los lleva al hacer clic? (Dejar en blanco si no aplica)">
        </div>
        <button type="submit" class="btn-submit" style="background: #ff9900; color: #0d041a; box-shadow: 0 0 10px #ff9900;"><i class="fas fa-image"></i> Publicar Banner</button>
      </form>
    </div>

    <h2 style="text-align: center;">🖼️ Banners Activos en Tienda</h2>
    <div id="listaBanners" class="grid-list">Cargando banners...</div>
  </div>

  <script>
    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById('tab-' + tabId).classList.add('active');
      element.classList.add('active');
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDH1DZqaIi5sKRXspXDUWbMUZ4nr5JIy8Q",
      authDomain: "sakura-gameverse.firebaseapp.com",
      projectId: "sakura-gameverse",
      storageBucket: "sakura-gameverse.firebasestorage.app",
      messagingSenderId: "226328425516",
      appId: "1:226328425516:web:8dc11761639228c6120d89"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ==========================================
    // LOGICA DE PRODUCTOS
    // ==========================================
    const formProducto = document.getElementById('formProducto');
    formProducto.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nombre = document.getElementById('prodNombre').value;
      const precio = parseFloat(document.getElementById('prodPrecio').value);
      const categoria = document.getElementById('prodCat').value;
      const estado = document.getElementById('prodEstado').value;
      const fotosRaw = document.getElementById('prodFotos').value;
      
      const fotosArray = fotosRaw.split(',').map(f => f.trim()).filter(f => f !== '');

      try {
        await addDoc(collection(db, "productos"), {
          nombre, precio, categoria, estado,
          fotos: fotosArray,
          timestamp: serverTimestamp()
        });
        alert('✅ ¡Producto subido con éxito!');
        formProducto.reset();
        cargarProductos();
      } catch (error) {
        console.error("Error al guardar:", error);
        alert('❌ Error al subir el producto.');
      }
    });

    async function cargarProductos() {
      const lista = document.getElementById('listaProductos');
      lista.innerHTML = "<p>Cargando...</p>";
      try {
        const q = query(collection(db, "productos"), orderBy("timestamp", "desc"));
        const querySnapshot = await getDocs(q);
        lista.innerHTML = "";
        
        querySnapshot.forEach((documento) => {
          const data = documento.data();
          let portada = (data.fotos && data.fotos.length > 0) ? data.fotos[0] : 'logo.webp';
          
          lista.innerHTML += `
            <div class="admin-card">
              <img src="${portada}" alt="Producto">
              <h3>${data.nombre}</h3>
              <p style="color:var(--secondary-color); margin:5px 0;">$${data.precio.toFixed(2)}</p>
              <button class="btn-delete" onclick="borrarProducto('${documento.id}')"><i class="fas fa-trash"></i> Eliminar</button>
            </div>
          `;
        });
      } catch (error) {
        lista.innerHTML = "<p>Error al cargar inventario.</p>";
      }
    }

    window.borrarProducto = async function(id) {
      if(confirm('⚠️ ¿Seguro que quieres eliminar este producto de la nube?')) {
        await deleteDoc(doc(db, "productos", id));
        alert('🗑️ Producto eliminado.');
        cargarProductos();
      }
    }

    // ==========================================
    // LOGICA DE BANNERS
    // ==========================================
    const formBanner = document.getElementById('formBanner');
    formBanner.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const imgUrl = document.getElementById('bannerImg').value.trim();
      const linkUrl = document.getElementById('bannerLink').value.trim();

      try {
        await addDoc(collection(db, "banners"), {
          imgUrl: imgUrl,
          linkUrl: linkUrl,
          timestamp: serverTimestamp()
        });
        alert('✅ ¡Banner subido y activo en la tienda!');
        formBanner.reset();
        cargarBanners();
      } catch (error) {
        console.error("Error al guardar banner:", error);
        alert('❌ Error al subir el banner.');
      }
    });

    async function cargarBanners() {
      const lista = document.getElementById('listaBanners');
      lista.innerHTML = "<p>Cargando banners...</p>";
      try {
        const q = query(collection(db, "banners"), orderBy("timestamp", "desc"));
        const querySnapshot = await getDocs(q);
        lista.innerHTML = "";
        
        if (querySnapshot.empty) {
          lista.innerHTML = "<p style='color:#aaa;'>No hay banners activos. ¡Agrega uno arriba!</p>";
        }

        querySnapshot.forEach((documento) => {
          const data = documento.data();
          lista.innerHTML += `
            <div class="admin-card">
              <img src="${data.imgUrl}" alt="Banner">
              ${data.linkUrl ? `<a href="${data.linkUrl}" target="_blank" style="color:var(--secondary-color); font-size:0.8em; display:block; margin-bottom:10px;">Ver Enlace</a>` : ''}
              <button class="btn-delete" onclick="borrarBanner('${documento.id}')"><i class="fas fa-trash"></i> Eliminar Banner</button>
            </div>
          `;
        });
      } catch (error) {
        lista.innerHTML = "<p>Error al cargar banners.</p>";
      }
    }

    window.borrarBanner = async function(id) {
      if(confirm('⚠️ ¿Seguro que quieres quitar este banner de tu tienda?')) {
        await deleteDoc(doc(db, "banners", id));
        alert('🗑️ Banner eliminado.');
        cargarBanners();
      }
    }

    // Cargar datos iniciales
    cargarProductos();
    cargarBanners();
  </script>
</body>
</html>
