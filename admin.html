<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Sakura Gameverse 🌸</title>
  <style>
    body { background-color: #0d041a; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: linear-gradient(135deg, #1a0b38 0%, #11052C 100%); padding: 20px; border-radius: 15px; border: 1px solid rgba(0,229,255,0.3); box-shadow: 0 0 20px rgba(0,229,255,0.2); }
    h2, h3 { color: #00e5ff; text-align: center; }
    h3 { color: #FF007F; margin-top: 30px; }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; background: #0d041a; color: white; border: 1px solid #00e5ff; border-radius: 8px; font-size: 1em; }
    button { background: #FF007F; border: none; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px #FF007F; transition: transform 0.2s; }
    button:active { transform: scale(0.95); }
    .btn-logout { background: #333; box-shadow: none; border: 1px solid #555; }
    .btn-delete { background: #ff3366; box-shadow: none; width: auto; padding: 8px 15px; font-size: 0.9em; }
    
    .card { background: #11052C; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px dashed #FF007F; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .card-info { flex-grow: 1; }
    .badge { background: #00e5ff; color: #0d041a; padding: 3px 8px; border-radius: 10px; font-size: 0.8em; font-weight: bold; }
    
    #dashboard { display: none; }
  </style>
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div class="container" id="loginScreen">
    <h2>🔐 Ingreso Autorizado</h2>
    <p style="text-align: center; font-size: 0.9em; color: #aaa;">Solo personal de Sakura Gameverse</p>
    <input type="email" id="email" placeholder="Correo de administrador">
    <input type="password" id="pass" placeholder="Contraseña">
    <button onclick="iniciarSesion()">Entrar al Sistema 🚀</button>
  </div>

  <!-- PANTALLA DEL INVENTARIO -->
  <div class="container" id="dashboard">
    <h2>🌸 Panel de Control Nube</h2>
    <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión 🔒</button>
    
    <h3>➕ Añadir Nuevo Producto</h3>
    <input type="text" id="pNombre" placeholder="Nombre del producto (Ej: Katana Zoro)">
    <input type="number" id="pPrecio" placeholder="Precio en dólares (Ej: 25.50)" step="0.01">
    
    <select id="pCategoria">
      <option value="mangas">📚 Mangas</option>
      <option value="ropa">👕 Ropa / Hoodies</option>
      <option value="mandos">🎮 Mandos PC</option>
      <option value="teclados">⌨️ Teclados</option>
      <option value="audifonos">🎧 Audífonos</option>
      <option value="figuras">🗿 Figuras</option>
      <option value="peluches">🧸 Peluches</option>
      <option value="cartas">🃏 Cartas TCG</option>
      <option value="katanas">⚔️ Katanas</option>
      <option value="lamparas">💡 Lámparas</option>
    </select>
    
    <select id="pEstado">
      <option value="Envío Inmediato 📦">📦 Stock Inmediato</option>
      <option value="Por Encargo ⚡">⚡ Por Encargo</option>
    </select>
    
    <input type="text" id="pImagen" placeholder="URL o nombre de foto (Ej: figuras.jpg)">
    <button onclick="guardarProducto()">Guardar en la Nube ☁️</button>

    <h3>📦 Inventario Actual</h3>
    <div id="listaProductos">Cargando inventario...</div>
  </div>

  <script type="module">
    // Importaciones oficiales de Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, orderBy, query } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    // Tus llaves maestras
    const firebaseConfig = {
      apiKey: "AIzaSyDH1DZqaIi5sKRXspXDUWbMUZ4nr5JIy8Q",
      authDomain: "sakura-gameverse.firebaseapp.com",
      projectId: "sakura-gameverse",
      storageBucket: "sakura-gameverse.firebasestorage.app",
      messagingSenderId: "226328425516",
      appId: "1:226328425516:web:8dc11761639228c6120d89"
    };

    // Inicializar la magia
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Funciones de Login
    window.iniciarSesion = () => {
      const e = document.getElementById('email').value;
      const p = document.getElementById('pass').value;
      if(!e || !p) return alert("Faltan datos, jefe.");
      signInWithEmailAndPassword(auth, e, p).catch(err => alert("Acceso denegado: " + err.message));
    };

    window.cerrarSesion = () => signOut(auth);

    // Detector de estado de sesión
    onAuthStateChanged(auth, user => {
      if(user) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        cargarProductos();
      } else {
        document.getElementById('loginScreen').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
      }
    });

    // Guardar producto en Firestore
    window.guardarProducto = async () => {
      const nombre = document.getElementById('pNombre').value.trim();
      const precio = parseFloat(document.getElementById('pPrecio').value);
      const categoria = document.getElementById('pCategoria').value;
      const estado = document.getElementById('pEstado').value;
      const imagen = document.getElementById('pImagen').value.trim() || 'logo.webp';

      if(!nombre || isNaN(precio)) return alert("¡Ey! El nombre y el precio son obligatorios. 👾");

      try {
        await addDoc(collection(db, "productos"), { 
          nombre, precio, categoria, estado, fotos: [imagen], timestamp: Date.now() 
        });
        alert("¡Producto guardado exitosamente en la nube! ✨");
        
        // Limpiar campos
        document.getElementById('pNombre').value = "";
        document.getElementById('pPrecio').value = "";
        document.getElementById('pImagen').value = "";
        
        cargarProductos();
      } catch (error) {
        alert("Error al guardar: " + error.message);
      }
    };

    // Cargar y mostrar productos desde Firestore
    window.cargarProductos = async () => {
      try {
        const q = query(collection(db, "productos"), orderBy("timestamp", "desc"));
        const querySnapshot = await getDocs(q);
        let html = "";
        
        if (querySnapshot.empty) {
          html = "<p style='color: #aaa; text-align: center;'>El inventario está vacío.</p>";
        } else {
          querySnapshot.forEach((doc) => {
            let p = doc.data();
            html += `
              <div class="card">
                <div class="card-info">
                  <div style="font-size: 1.1em; font-weight: bold; color: #00e5ff; margin-bottom: 5px;">${p.nombre}</div>
                  <div style="color: white; margin-bottom: 5px;">Precio: <strong style="color: #FF007F;">$${p.precio.toFixed(2)}</strong></div>
                  <span class="badge">${p.categoria}</span> <span class="badge" style="background: #FF007F; color: white;">${p.estado}</span>
                </div>
                <button class="btn-delete" onclick="borrarProducto('${doc.id}')">🗑️ Borrar</button>
              </div>`;
          });
        }
        document.getElementById('listaProductos').innerHTML = html;
      } catch (error) {
        document.getElementById('listaProductos').innerHTML = "Error cargando datos: Verifica que la base de datos esté en Modo de Prueba.";
      }
    };

    // Borrar producto de Firestore
    window.borrarProducto = async (id) => {
      if(confirm("¿Estás 100% seguro de eliminar este artículo? 😱")) {
        await deleteDoc(doc(db, "productos", id));
        cargarProductos();
      }
    };
  </script>
</body>
</html>
