<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Sakura Gameverse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0d041a;
      --card-bg: linear-gradient(135deg, #1a0b38 0%, #11052C 100%);
      --text-color: white;
      --primary-color: #FF007F;
      --secondary-color: #00e5ff;
      --border-color: rgba(0,229,255,0.3);
      --hero-bg: #11052C;
    }
    body { margin: 0; background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; padding: 20px; }
    .admin-container { max-width: 600px; margin: 0 auto; background: var(--hero-bg); border: 2px solid var(--primary-color); padding: 25px; border-radius: 20px; box-shadow: 0 0 25px rgba(255,0,127,0.4); }
    h2 { color: var(--secondary-color); text-align: center; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; color: var(--secondary-color); font-weight: bold; margin-bottom: 5px; }
    .form-control { width: 100%; background: var(--bg-color); border: 1px solid var(--secondary-color); color: var(--text-color); padding: 10px; border-radius: 10px; box-sizing: border-box; outline: none; }
    .btn-enviar { background: var(--primary-color); color: white; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 20px; cursor: pointer; font-size: 1.1em; box-shadow: 0 0 10px var(--primary-color); }
    .btn-enviar:hover { background: var(--secondary-color); color: #0d041a; }
    .nav-regresar { display: block; text-align: center; margin-bottom: 15px; color: var(--secondary-color); text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="admin-container">
  <a href="index.html" class="nav-regresar">⬅ Volver a la Tienda</a>
  <h2>🛠️ Panel Admin - Sakura Gameverse</h2>
  
  <div class="form-group">
    <label>Nombre del Producto:</label>
    <input type="text" id="adminNombre" class="form-control" placeholder="Ej: Recarga de Diamantes / Juego">
  </div>

  <div class="form-group">
    <label>Precio USD ($):</label>
    <input type="number" id="adminPrecio" class="form-control" step="0.01" placeholder="25.00">
  </div>

  <div class="form-group">
    <label>Categoría:</label>
    <select id="adminCategoria" class="form-control">
      <option value="recargas">💎 Recargas</option>
      <option value="mangas">📚 Mangas</option>
      <option value="ropa">👕 Ropa / Hoodies</option>
      <option value="mandos">🎮 Mandos PC</option>
      <option value="teclados">⌨️ Teclados</option>
      <option value="audifonos">🎧 Audífonos</option>
      <option value="figuras">🗿 Figuras</option>
      <option value="peluches">🧸 Peluches</option>
      <option value="cartas">🃏 Cartas TCG</option>
      <option value="katanas">⚔️ Katanas</option>
      <option value="lamparas">💡 Lámparas</option>
    </select>
  </div>

  <div class="form-group">
    <label>Estado:</label>
    <select id="adminEstado" class="form-control">
      <option value="Envío Inmediato 📦">Envío Inmediato 📦</option>
      <option value="Por Encargo ⚡">Por Encargo ⚡</option>
    </select>
  </div>

  <div class="form-group">
    <label>Foto Principal (Archivo):</label>
    <input type="file" id="adminFoto1" class="form-control" accept="image/*">
  </div>

  <button class="btn-enviar" onclick="subirProductoFirebase()">🚀 Subir Producto a la Nube</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDH1DZqaIi5sKRXspXDUWbMUZ4nr5JIy8Q",
    authDomain: "sakura-gameverse.firebaseapp.com",
    projectId: "sakura-gameverse",
    storageBucket: "sakura-gameverse.firebasestorage.app",
    messagingSenderId: "226328425516",
    appId: "1:226328425516:web:8dc11761639228c6120d89"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  window.subirProductoFirebase = async function() {
    let nombre = document.getElementById('adminNombre').value.trim();
    let precio = parseFloat(document.getElementById('adminPrecio').value);
    let categoria = document.getElementById('adminCategoria').value;
    let estado = document.getElementById('adminEstado').value;
    let fileInput = document.getElementById('adminFoto1');

    if (!nombre || isNaN(precio)) {
      alert("⚠️ Por favor ingresa un nombre y un precio válido.");
      return;
    }

    try {
      let fotoUrl = "logo.webp"; 

      if (fileInput.files && fileInput.files[0]) {
        let file = fileInput.files[0];
        let storageRef = ref(storage, `productos/${Date.now()}_${file.name}`);
        let snapshot = await uploadBytes(storageRef, file);
        fotoUrl = await getDownloadURL(snapshot.ref);
      }

      await addDoc(collection(db, "productos"), {
        nombre: nombre,
        precio: precio,
        categoria: categoria,
        estado: estado,
        fotos: [fotoUrl],
        timestamp: serverTimestamp()
      });

      alert("🎉 ¡Producto subido exitosamente a Firebase!");
      document.getElementById('adminNombre').value = "";
      document.getElementById('adminPrecio').value = "";
      fileInput.value = "";
    } catch (error) {
      console.error("Error al subir a Firebase:", error);
      alert("❌ Error al conectar con Firebase. Revisa las reglas de Firestore y Storage en tu consola.");
    }
  }
</script>

</body>
</html>
