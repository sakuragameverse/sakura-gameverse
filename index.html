<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Gameverse - Tienda Oficial</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #0d041a;
      --card-bg: linear-gradient(135deg, #1a0b38 0%, #11052C 100%);
      --text-color: white;
      --primary-color: #FF007F;
      --secondary-color: #00e5ff;
      --border-color: rgba(0,229,255,0.3);
      --hero-bg: #11052C;
    }

    body { margin: 0; background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; overflow-x: hidden; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); }
    ::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }

    /* HEADER TIENDA */
    .store-header {
      background: var(--hero-bg);
      border-bottom: 2px solid var(--primary-color);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 20px rgba(255,0,127,0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .store-logo-area { display: flex; align-items: center; gap: 12px; }
    .store-logo { max-width: 50px; border-radius: 50%; border: 2px solid var(--secondary-color); }
    .store-name { font-size: 1.1em; font-weight: bold; color: var(--secondary-color); text-shadow: 0 0 8px rgba(0,229,255,0.5); }

    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn-icon-header {
      background: var(--card-bg);
      border: 1px solid var(--secondary-color);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85em;
      box-shadow: 0 0 10px rgba(0,229,255,0.2);
    }
    .btn-icon-header:hover { background: rgba(0,229,255,0.2); }

    /* CONTENEDOR PRINCIPAL */
    .store-container { max-width: 1100px; margin: 0 auto; padding: 25px 15px; }

    .banner-bcv {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 15px;
      padding: 15px 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }
    .banner-bcv h4 { margin: 0; color: var(--secondary-color); font-size: 0.95em; }
    .banner-bcv span { color: #ffcc00; font-weight: bold; font-size: 1.1em; }

    /* GRID DE PRODUCTOS */
    .productos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .producto-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }
    .producto-card:hover { transform: translateY(-5px); border-color: var(--secondary-color); }

    .producto-img-container { width: 100%; height: 200px; background: #000; overflow: hidden; position: relative; }
    .producto-img { width: 100%; height: 100%; object-fit: cover; }
    
    .producto-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
    .producto-cat { font-size: 0.75em; color: var(--secondary-color); text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
    .producto-titulo { font-size: 1em; font-weight: bold; margin: 0 0 10px 0; }
    .producto-precios { margin-top: auto; margin-bottom: 15px; }
    .precio-usd { font-size: 1.2em; font-weight: bold; color: var(--primary-color); }
    .precio-bs { font-size: 0.85em; opacity: 0.8; color: #ffcc00; }

    .btn-comprar {
      background: var(--secondary-color);
      color: #0d041a;
      border: none;
      padding: 10px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 0 10px rgba(0,229,255,0.3);
      transition: transform 0.2s;
    }
    .btn-comprar:hover { transform: scale(1.02); }

    /* CARRITO MODAL / FLOTANTE */
    .carrito-flotante {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary-color);
      color: white;
      border-radius: 50px;
      padding: 12px 22px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px var(--primary-color);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 200;
    }
  </style>
</head>
<body>

<div class="store-header">
  <div class="store-logo-area">
    <img src="logo.webp" alt="Logo" class="store-logo">
    <div class="store-name">Sakura Gameverse</div>
  </div>
  <div class="header-actions">
    <a href="admin.html" class="btn-icon-header"><i class="fas fa-cog"></i> Admin</a>
  </div>
</div>

<div class="store-container">
  <!-- BANNER TASA BCV -->
  <div class="banner-bcv">
    <h4>⚡ Tasa Oficial BCV del Día</h4>
    <span id="labelTasaBcv">Bs. 0.00</span>
  </div>

  <!-- CATÁLOGO DE PRODUCTOS DINÁMICO -->
  <div class="productos-grid" id="catalogoTienda">
    <!-- Se llena automáticamente con los productos del Admin -->
  </div>
</div>

<!-- BOTÓN CARRITO -->
<div class="carrito-flotante" onclick="verCarrito()">
  <i class="fas fa-shopping-cart"></i> Carrito (<span id="contadorCarrito">0</span>)
</div>

<script>
  // CARGAR DATOS DESDE EL LOCALSTORAGE COMPARTIDO CON EL ADMIN
  let tasaBcv = parseFloat(localStorage.getItem('sakura_tasa_bcv')) || 854.46;
  document.getElementById('labelTasaBcv').innerText = `Bs. ${tasaBcv.toFixed(2)}`;

  let inventarioTienda = JSON.parse(localStorage.getItem('sakura_inventario_admin')) || [
    { nombre: "Tomo Manga Original", categoria: "Mangas", precio: 12.00, estado: "Inmediato", fotos: ["figuras.jpg"] },
    { nombre: "Booster Box Cartas TCG", categoria: "Cartas", precio: 40.00, estado: "Inmediato", fotos: ["accesorios.jpeg"] }
  ];

  let carrito = [];

  function renderTienda() {
    let grid = document.getElementById('catalogoTienda');
    grid.innerHTML = "";

    inventarioTienda.forEach((prod, index) => {
      let precioBs = prod.precio * tasaBcv;
      let imagenSrc = (prod.fotos && prod.fotos.length > 0) ? prod.fotos[0] : 'logo.webp';

      grid.innerHTML += `
        <div class="producto-card">
          <div class="producto-img-container">
            <img src="${imagenSrc}" alt="${prod.nombre}" class="producto-img">
          </div>
          <div class="producto-info">
            <div class="producto-cat">${prod.categoria} • ${prod.estado || 'Inmediato'}</div>
            <div class="producto-titulo">${prod.nombre}</div>
            <div class="producto-precios">
              <div class="precio-usd">$${prod.precio.toFixed(2)}</div>
              <div class="precio-bs">≈ Bs. ${precioBs.toFixed(2)}</div>
            </div>
            <button class="btn-comprar" onclick="agregarAlCarrito(${index})"><i class="fas fa-cart-plus"></i> Agregar al Carrito</button>
          </div>
        </div>
      `;
    });
  }
  renderTienda();

  function agregarAlCarrito(index) {
    let productoSeleccionado = inventarioTienda[index];
    carrito.push(productoSeleccionado);
    document.getElementById('contadorCarrito').innerText = carrito.length;
    confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
    alert(`🛒 ¡${productoSeleccionado.nombre} agregado al carrito!`);
  }

  function verCarrito() {
    if (carrito.length === 0) {
      alert("Tu carrito está vacío, jefe. ¡Elige tus productos otaku favoritos!");
      return;
    }

    let totalUsd = carrito.reduce((sum, item) => sum + item.precio, 0);
    let totalBs = totalUsd * tasaBcv;
    let detalleTexto = carrito.map(i => i.name || i.nombre).join(", ");

    let gamerProfile = JSON.parse(localStorage.getItem('sakura_gamer_profile')) || { tag: "GamerOtaku_VE" };

    // REGISTRAR AUTOMÁTICAMENTE EN LOS PEDIDOS DEL ADMIN
    let listaPedidos = JSON.parse(localStorage.getItem('sakura_pedidos')) || [];
    let nuevoPedido = {
      gamerTag: gamerProfile.tag,
      detalle: detalleTexto,
      totalUsd: totalUsd,
      estatus: "Pendiente"
    };
    listaPedidos.push(nuevoPedido);
    localStorage.setItem('sakura_pedidos', JSON.stringify(listaPedidos));

    // ABRIR WHATSAPP
    let telefonoWhatsApp = "584244970576"; // Tu número
    let mensaje = `¡Hola Sakura Gameverse! 🌸🤖 Soy *${gamerProfile.tag}* y quiero confirmar este pedido:%0A%0A📦 *Productos:* ${detalleTexto}%0A💵 *Total USD:* $${totalUsd.toFixed(2)}%0A🇻🇪 *Total Bs:* Bs. ${totalBs.toFixed(2)}%0A%0A¡Quedo atento para coordinar el pago y el envío por ZOOM o MRW! 🚀`;

    window.open(`https://wa.me/${telefonoWhatsApp}?text=${mensaje}`, '_blank');
  }
</script>

</body>
</html>
