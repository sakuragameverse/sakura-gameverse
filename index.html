<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Gameverse | RPG Edition</title>
  <link rel="icon" type="image/webp" href="logo.webp?v=2">
  <meta name="theme-color" content="#090314">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    /* VARIABLES Y ESTILOS BASE COMPRIMIDOS */
    :root { --bg-color: #05010a; --glass-bg: rgba(17, 5, 36, 0.45); --glass-border: rgba(255, 255, 255, 0.08); --text-color: #e6e9f0; --text-muted: #8b8f9e; --primary-color: #ff007f; --primary-glow: rgba(255, 0, 127, 0.4); --secondary-color: #00e5ff; --secondary-glow: rgba(0, 229, 255, 0.4); --radius-sm: 8px; --radius-md: 16px; --radius-pill: 50px; }
    * { box-sizing: border-box; } body { margin: 0; background-color: var(--bg-color); color: var(--text-color); font-family: 'Rajdhani', sans-serif; padding-bottom: 90px; }
    h1, h2, h3, h4 { font-family: 'Chakra Petch', sans-serif; text-transform: uppercase; }
    .btn-comprar { background: linear-gradient(135deg, var(--primary-color), #cc0066); color: #fff; border: none; padding: 14px; font-family: 'Chakra Petch', sans-serif; font-size: 1.05em; font-weight: 700; border-radius: var(--radius-sm); cursor: pointer; width: 100%; margin-top: 14px; transition: all 0.3s ease; box-shadow: 0 4px 15px var(--primary-glow); }
    .btn-comprar:disabled { filter: grayscale(100%); cursor: not-allowed; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 0, 6, 0.75); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
    .modal-content { background: rgba(14, 4, 31, 0.95); padding: 24px; border-radius: var(--radius-md); max-width: 95%; width: 440px; border: 1px solid var(--glass-border); position: relative; max-height: 90vh; overflow-y: auto; }
    .cerrar-modal { position: absolute; top: 12px; right: 14px; font-size: 24px; color: var(--text-muted); cursor: pointer; background: rgba(0,0,0,0.3); border: 1px solid transparent; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    
    /* ESTILOS RPG INVENTARIO */
    .rpg-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
    .rpg-item-card { background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding: 10px; text-align: center; position: relative; cursor: pointer; transition: all 0.2s; }
    .rpg-item-card:hover { border-color: var(--secondary-color); background: rgba(0, 229, 255, 0.1); }
    .rpg-item-card.equipped { border-color: #25d366; background: rgba(37, 211, 102, 0.1); box-shadow: 0 0 10px rgba(37, 211, 102, 0.2); }
    .rpg-item-icon { font-size: 2em; margin-bottom: 5px; }
    .rpg-item-name { font-size: 0.85em; font-weight: bold; font-family: 'Chakra Petch', sans-serif; }
    .rpg-item-stats { font-size: 0.75em; color: var(--secondary-color); }
    
    .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 500px; background: rgba(10, 2, 22, 0.85); border: 1px solid var(--glass-border); border-radius: var(--radius-pill); display: flex; justify-content: space-around; padding: 12px 10px; z-index: 2500; backdrop-filter: blur(15px); }
    .nav-item { color: var(--text-muted); display: flex; flex-direction: column; align-items: center; font-size: 0.7em; font-weight: 700; cursor: pointer; width: 25%; }
    .nav-item i { font-size: 1.5em; margin-bottom: 4px; }
    .nav-item:hover, .nav-item.active { color: #fff; } .nav-item:hover i { color: var(--secondary-color); }
  </style>
</head>
<body>

<!-- BOTONES FLOTANTES DE NAVEGACIÓN -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="abrirGremioModal()"><i class="fas fa-campground"></i><span>El Gremio</span></div>
  <div class="nav-item" onclick="abrirGamerProfileModal()"><i class="fas fa-user-ninja"></i><span>Mi Perfil</span></div>
</div>

<!-- MODAL GAMER PROFILE & INVENTARIO -->
<div id="modalGamerProfile" class="modal">
  <div class="modal-content" style="text-align: center;">
    <button class="cerrar-modal" onclick="cerrarGamerProfileModal()">×</button>
    <h3 style="color: var(--secondary-color); margin-top: 0;">Perfil RPG</h3>
    <input type="text" id="inputGamerTag" style="background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--glass-border); padding: 8px; border-radius: 8px; text-align: center; margin-bottom: 15px; width: 100%; font-weight: bold;" placeholder="GamerTag">
    
    <div style="background: rgba(0,0,0,0.3); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--glass-border); text-align: left; font-size: 0.9em; margin-bottom: 15px;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
        <span>Nivel: <strong id="lblRango" style="color: #ffaa00;">Genin</strong></span>
        <span><strong id="lblTokens" style="color: #ffaa00;"><i class="fas fa-coins"></i> 0</strong> | <strong id="lblXp" style="color: var(--secondary-color);">0</strong> XP</span>
      </div>
      
      <!-- STATS RPG ACTUALIZADAS -->
      <div style="font-size: 0.85em; color: #fff; background: rgba(0, 229, 255, 0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(0,229,255,0.2); text-align: center;">
        <div style="margin-bottom: 4px;">Clase: <strong id="lblProfesion" style="color: var(--secondary-color); text-transform: uppercase;">Ninguna</strong></div>
        ❤️ Vida: <span id="lblHp" style="font-weight: bold; color: #ff3366;">100</span> | 
        ⚔️ ATK: <span id="lblAtk" style="font-weight: bold; color: #ffaa00;">10</span> | 
        🛡️ DEF: <span id="lblDef" style="font-weight: bold; color: #00e5ff;">5</span>
      </div>
    </div>

    <h4 style="color: #fff; text-align: left; margin-bottom: 5px;"><i class="fas fa-backpack"></i> Inventario de Equipo</h4>
    <p style="font-size: 0.75em; color: var(--text-muted); text-align: left;">Haz clic en un arma para equiparla y mejorar tus estadísticas de ataque y defensa.</p>
    <div id="contenedorInventario" class="rpg-grid"></div>
    
    <button class="btn-comprar" onclick="guardarGamerTag()"><i class="fas fa-save"></i> Guardar Perfil</button>
  </div>
</div>

<!-- MODAL EL GREMIO (RPG AVANZADO) -->
<div id="modalGremio" class="modal">
  <div class="modal-content" style="text-align: center;">
    <button class="cerrar-modal" onclick="cerrarGremioModal()">×</button>
    <h3 style="color: #25d366; margin-top: 0;"><i class="fas fa-campground"></i> Tablón del Gremio</h3>
    
    <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: var(--radius-md); border: 1px dashed #25d366; margin-bottom: 15px;">
      <div id="rpgResultado" style="font-weight: bold; color: #fff; min-height: 40px;">¿Qué deseas hacer hoy, aventurero?</div>
    </div>

    <!-- ACCIONES BÁSICAS -->
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
      <button class="btn-comprar" style="margin-top: 0; background: linear-gradient(135deg, #ffaa00, #ff5500);" onclick="accionRPG('cazar')">
        <i class="fas fa-crosshairs"></i> Cazar<br><span style="font-size: 0.7em;">(Monstruos base)</span>
      </button>
      <button class="btn-comprar" style="margin-top: 0; background: linear-gradient(135deg, #a8a8a8, #5c5c5c);" onclick="accionRPG('minar')">
        <i class="fas fa-hammer"></i> Minar<br><span style="font-size: 0.7em;">(Materiales)</span>
      </button>
    </div>

    <!-- MAZMORRAS Y JEFES -->
    <h4 style="color: #ff3366; margin-top: 20px; margin-bottom: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;"><i class="fas fa-dungeon"></i> Mazmorras de Jefe</h4>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <button class="btn-comprar" style="margin-top:0; background: rgba(0, 229, 255, 0.1); border: 1px solid #00e5ff; color: #00e5ff; box-shadow:none;" onclick="entrarMazmorra('facil')">
        🌲 Bosque Slime (Nv. Genin) - Dificultad Baja
      </button>
      <button class="btn-comprar" style="margin-top:0; background: rgba(176, 0, 255, 0.1); border: 1px solid #b000ff; color: #b000ff; box-shadow:none;" onclick="entrarMazmorra('media')">
        🦇 Cueva Sangrienta (Nv. Chūnin) - Dificultad Media
      </button>
      <button class="btn-comprar" style="margin-top:0; background: rgba(255, 51, 102, 0.1); border: 1px solid #ff3366; color: #ff3366; box-shadow:none;" onclick="entrarMazmorra('dificil')">
        🐉 Torre del Dragón (Nv. Jōnin+) - Dificultad Brutal
      </button>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // NÚCLEO DE DATOS RPG
  // ==========================================
  let gamerProfile = JSON.parse(localStorage.getItem('sakura_gamer_profile')) || { 
    tag: "GamerOtaku_VE", xp: 150, tokens: 0, rango: "Genin", waifus: [],
    profesion: "", 
    stats: { hp: 100, atk: 10, def: 5 },
    inventario: [], // Array de objetos ganados
    equipo: { armaId: null } // Lo que tiene equipado actualmente
  };

  // Base de datos local de botín raro (SSR) para las mazmorras
  const itemsDropTables = {
    facil: [
      { id: "w_1", nombre: "Daga Oxidada", icono: "🗡️", atk: 5, def: 0, rareza: "N" },
      { id: "w_2", nombre: "Escudo de Madera", icono: "🛡️", atk: 0, def: 10, rareza: "N" }
    ],
    media: [
      { id: "w_3", nombre: "Espada Larga", icono: "⚔️", atk: 20, def: 0, rareza: "R" },
      { id: "w_4", nombre: "Grimorio Menor", icono: "📖", atk: 25, def: -5, rareza: "SR" }
    ],
    dificil: [
      { id: "w_5", nombre: "Excalibur (SSR)", icono: "✨", atk: 80, def: 20, rareza: "SSR" },
      { id: "w_6", nombre: "Armadura de Dragón", icono: "🐉", atk: 10, def: 100, rareza: "SSR" }
    ]
  };

  function guardarProgresoLocal() {
    localStorage.setItem('sakura_gamer_profile', JSON.stringify(gamerProfile));
    actualizarUiPerfil();
  }

  // ==========================================
  // PROFESIÓN Y STATS
  // ==========================================
  window.verificarProfesion = function() {
    if (!gamerProfile.profesion || gamerProfile.profesion === "") {
      let eleccion = prompt(`¡Bienvenido al Gremio de Sakura!\nDebes elegir tu camino aventurero. Escribe el número:\n\n1. Guerrero (Mucha Defensa)\n2. Cazador (Balanceado)\n3. Hechicero (Mucho Ataque)`);
      
      if (eleccion === "1") { gamerProfile.profesion = "Guerrero"; gamerProfile.stats = { hp: 150, atk: 8, def: 15 }; } 
      else if (eleccion === "2") { gamerProfile.profesion = "Cazador"; gamerProfile.stats = { hp: 100, atk: 15, def: 8 }; } 
      else if (eleccion === "3") { gamerProfile.profesion = "Hechicero"; gamerProfile.stats = { hp: 80, atk: 25, def: 5 }; } 
      else { return verificarProfesion(); }
      
      guardarProgresoLocal();
      alert(`¡Genial! Ahora eres un ${gamerProfile.profesion}. Ve a 'Mi Perfil' para ver tus stats y equipar objetos.`);
    }
  };

  function actualizarUiPerfil() {
    document.getElementById('inputGamerTag').value = gamerProfile.tag;
    document.getElementById('lblRango').innerText = gamerProfile.rango;
    document.getElementById('lblXp').innerText = gamerProfile.xp;
    document.getElementById('lblTokens').innerHTML = `<i class="fas fa-coins"></i> ${gamerProfile.tokens}`;
    
    // Stats base + stats del arma equipada
    let extraAtk = 0; let extraDef = 0;
    if (gamerProfile.equipo.armaId) {
      let item = gamerProfile.inventario.find(i => i.id === gamerProfile.equipo.armaId);
      if (item) { extraAtk = item.atk; extraDef = item.def; }
    }

    document.getElementById('lblProfesion').innerText = gamerProfile.profesion || "Ninguna";
    document.getElementById('lblHp').innerText = gamerProfile.stats.hp;
    document.getElementById('lblAtk').innerText = `${gamerProfile.stats.atk} (+${extraAtk})`;
    document.getElementById('lblDef').innerText = `${gamerProfile.stats.def} (+${extraDef})`;

    renderizarInventario();
  }

  // ==========================================
  // INVENTARIO Y EQUIPAMIENTO
  // ==========================================
  function renderizarInventario() {
    let cont = document.getElementById('contenedorInventario');
    cont.innerHTML = "";
    
    if (!gamerProfile.inventario || gamerProfile.inventario.length === 0) {
      cont.innerHTML = `<div style="grid-column: 1/-1; color: var(--text-muted); font-size: 0.85em;">Tu mochila está vacía. Ve a cazar o a las mazmorras para conseguir equipo.</div>`;
      return;
    }

    gamerProfile.inventario.forEach(item => {
      let isEquipped = gamerProfile.equipo.armaId === item.id;
      let cl = isEquipped ? 'rpg-item-card equipped' : 'rpg-item-card';
      
      cont.innerHTML += `
        <div class="${cl}" onclick="equiparItem('${item.id}')">
          <div class="rpg-item-icon">${item.icono}</div>
          <div class="rpg-item-name">${item.nombre}</div>
          <div class="rpg-item-stats">ATK +${item.atk} | DEF +${item.def}</div>
          <div style="font-size: 0.65em; margin-top: 5px; color: ${isEquipped ? '#25d366' : '#888'};">${isEquipped ? 'EQUIPADO' : 'Click para equipar'}</div>
        </div>
      `;
    });
  }

  window.equiparItem = function(id) {
    if (gamerProfile.equipo.armaId === id) {
      gamerProfile.equipo.armaId = null; // Desequipar
    } else {
      gamerProfile.equipo.armaId = id; // Equipar
    }
    guardarProgresoLocal();
  };

  // ==========================================
  // ACCIONES Y MAZMORRAS
  // ==========================================
  window.abrirGremioModal = function() { verificarProfesion(); document.getElementById('modalGremio').style.display = 'flex'; };
  window.cerrarGremioModal = function() { document.getElementById('modalGremio').style.display = 'none'; };
  window.abrirGamerProfileModal = function() { actualizarUiPerfil(); document.getElementById('modalGamerProfile').style.display = 'flex'; };
  window.cerrarGamerProfileModal = function() { document.getElementById('modalGamerProfile').style.display = 'none'; };
  window.guardarGamerTag = function() { gamerProfile.tag = document.getElementById('inputGamerTag').value.trim(); guardarProgresoLocal(); alert("Guardado"); };

  window.accionRPG = function(tipo) {
    let rng = Math.floor(Math.random() * 100);
    let msj = ""; let xpG = 0; let tokG = 0;
    
    if (tipo === 'cazar') {
      if (rng < 30) { msj = "No encontraste monstruos."; xpG = 5; }
      else if (rng < 85) { msj = "Cazaste un Goblin."; xpG = 15; tokG = 2; }
      else { msj = "¡Cazaste un Lobo Huargo Gigante!"; xpG = 40; tokG = 10; }
    } else if (tipo === 'minar') {
      if (rng < 40) { msj = "Solo encontraste piedras inútiles."; xpG = 10; }
      else if (rng < 90) { msj = "Minaste Mineral de Hierro x3."; xpG = 25; tokG = 5; }
      else { msj = "¡Has extraído un Cristal de Mithril brillante!"; xpG = 50; tokG = 20; }
    }

    gamerProfile.xp += xpG; gamerProfile.tokens += tokG; guardarProgresoLocal();
    document.getElementById('rpgResultado').innerHTML = `<span style="color:var(--secondary-color);">${msj}</span><br><span style="color:#25d366;">+${xpG} XP | +${tokG} Tokens</span>`;
  };

  window.entrarMazmorra = function(dificultad) {
    let extraAtk = 0; let extraDef = 0;
    if (gamerProfile.equipo.armaId) {
      let item = gamerProfile.inventario.find(i => i.id === gamerProfile.equipo.armaId);
      if (item) { extraAtk = item.atk; extraDef = item.def; }
    }

    let poderTotal = gamerProfile.stats.atk + extraAtk + gamerProfile.stats.def + extraDef + (gamerProfile.xp / 10);
    let poderJefe = 0; let nombreJefe = ""; let lootTable = itemsDropTables[dificultad];

    if (dificultad === 'facil') { poderJefe = 30; nombreJefe = "Rey Slime"; }
    if (dificultad === 'media') { poderJefe = 150; nombreJefe = "Vampiro Anciano"; }
    if (dificultad === 'dificil') { poderJefe = 500; nombreJefe = "Dragón del Caos"; }

    let log = document.getElementById('rpgResultado');
    log.innerHTML = `<span style="color: #ffaa00;">Entrando a la mazmorra... Enfrentando a ${nombreJefe}!</span>`;

    setTimeout(() => {
      // Simulación de batalla
      if (poderTotal >= poderJefe) {
        // GANA
        let itemDrop = lootTable[Math.floor(Math.random() * lootTable.length)];
        
        // Revisar si ya lo tiene para no duplicar infinitamente
        if (!gamerProfile.inventario.find(i => i.id === itemDrop.id)) {
            gamerProfile.inventario.push(itemDrop);
        }

        gamerProfile.xp += (poderJefe); gamerProfile.tokens += (poderJefe / 5);
        guardarProgresoLocal();

        log.innerHTML = `<span style="color: #25d366;">¡HAS DERROTADO A ${nombreJefe.toUpperCase()}!</span><br>
                         El jefe soltó: <strong>${itemDrop.icono} ${itemDrop.nombre}</strong><br>
                         <span style="font-size: 0.8em; color: var(--text-muted);">Revisa tu Mochila en Mi Perfil para equiparlo.</span>`;
        try{ confetti({ particleCount: 100, spread: 70 }); }catch(e){} 
      } else {
        // PIERDE
        log.innerHTML = `<span style="color: #ff3366;">${nombreJefe} te ha destrozado de un golpe.</span><br>
                         <span style="font-size: 0.8em;">Tu Poder Total (${Math.floor(poderTotal)}) es muy bajo para el Poder del Jefe (${poderJefe}). Sube de XP, caza más o equipa mejores objetos.</span>`;
      }
    }, 1500);
  };

  // Inicializar Ui
  actualizarUiPerfil();

</script>
</body>
</html>
