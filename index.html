<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Gameverse</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    body { margin: 0; background-color: #0d041a; color: white; font-family: sans-serif; overflow-x: hidden; }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0d041a; }
    ::-webkit-scrollbar-thumb { background: #FF007F; border-radius: 10px; }

    /* PANTALLA DE CARGA ORDENADA */
    #splash-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: #0d041a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
      overflow: hidden;
    }
    
    .race-track {
      position: relative;
      width: 100%;
      height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .splash-car {
      max-width: 240px;
      position: absolute;
      animation: car-drift 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes car-drift {
      0% { transform: translateX(-120vw) scale(0.8) rotate(-5deg); opacity: 0; }
      40% { transform: translateX(0vw) scale(1.05) rotate(2deg); opacity: 1; }
      60% { transform: translateX(0vw) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translateX(0vw) scale(1); opacity: 1; }
    }

    .smoke-puff {
      position: absolute;
      bottom: 25px;
      left: 44%;
      width: 12px;
      height: 12px;
      background: rgba(0, 229, 255, 0.6);
      border-radius: 50%;
      box-shadow: 0 0 15px #00e5ff, 0 0 30px #FF007F;
      animation: puff-out 0.8s infinite linear;
      opacity: 0;
    }

    @keyframes puff-out {
      0% { transform: translateX(0) scale(0.5); opacity: 0.8; }
      100% { transform: translateX(-70px) translateY(-25px) scale(2.2); opacity: 0; }
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    .loading-text {
      color: #00e5ff;
      font-weight: bold;
      font-size: 1.05em;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-shadow: 0 0 8px rgba(0,229,255,0.6);
    }

    .loading-bar-container {
      width: 220px;
      height: 6px;
      background: #11052C;
      border-radius: 10px;
      border: 1px solid #FF007F;
      overflow: hidden;
    }
    .loading-bar {
      width: 0%;
      height: 100%;
      background: #00e5ff;
      box-shadow: 0 0 10px #00e5ff;
      animation: load-progress 1.5s linear forwards;
    }
    @keyframes load-progress {
      to { width: 100%; }
    }

    .hero-banner { background-color: #11052C; text-align: center; padding: 50px 20px; border-bottom: 3px solid #FF007F; box-shadow: 0 0 20px rgba(255, 0, 127, 0.4); position: relative; z-index: 2; }
    .hero-logo { max-width: 260px; margin-bottom: 15px; filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.1)); }
    .hero-title { font-size: 1.3em; font-weight: bold; margin-bottom: 20px; letter-spacing: 1px; text-shadow: 2px 2px 5px rgba(0,0,0,0.8); }
    
    .container { padding: 30px 20px; max-width: 1200px; margin: 0 auto; position: relative; z-index: 2; }
    .section-title { text-align: center; color: #FF007F; font-size: 1.8em; margin-bottom: 20px; animation: neon-pulse 1.5s infinite alternate; }
    @keyframes neon-pulse { 0% { text-shadow: 0 0 5px #FF007F, 0 0 10px #FF007F; } 100% { text-shadow: 0 0 5px #fff, 0 0 15px #FF007F, 0 0 30px #FF007F; } }
    
    .search-box { text-align: center; margin-bottom: 20px; }
    .search-input { background: #11052C; border: 2px solid #00e5ff; color: white; padding: 10px 20px; width: 80%; max-width: 400px; border-radius: 25px; font-size: 1em; outline: none; box-shadow: 0 0 10px rgba(0,229,255,0.3); }
