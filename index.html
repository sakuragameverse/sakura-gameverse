<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Gameverse</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    body { margin: 0; background-color: #0d041a; color: white; font-family: sans-serif; overflow-x: hidden; }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0d041a; }
    ::-webkit-scrollbar-thumb { background: #FF007F; border-radius: 10px; }

    /* PANTALLA DE CARGA CON EL CARRO ACELERANDO Y HUMO */
    #splash-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: #0d041a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      overflow: hidden;
      transition: opacity 0.6s ease;
    }
    
    .pista {
      position: relative;
      width: 100%;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* EL CARRO DE TU LOGO ACELERANDO DESDE LA IZQUIERDA */
    .splash-logo {
      max-width: 250px;
      position: absolute;
      animation: car-drift 1.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      filter: drop-shadow(0 0 15px rgba(0,229,255,0.8));
    }

    @keyframes car-drift {
      0% { left: -100%; transform: scale(0.6) rotate(-5deg); opacity: 0; }
      30% { opacity: 1; }
      70% { left: 42%; transform: scale(1.1) rotate(2deg); }
      100% { left: 50%; transform: translate(-50%, 0) scale(1) rotate(0deg); }
    }

    /* EFECTO DE HUMO NEÓN ATRÁS DEL CARRO */
    .smoke {
      position: absolute;
      background: rgba(0, 229, 255, 0.4);
      border-radius: 50%;
      filter: blur(8px);
      animation: puff-smoke 1.2s infinite ease-out;
      z-index: -1;
    }

    @keyframes puff-smoke {
      0% { transform: scale(0.5) translateX(0); opacity: 0.8; }
      100% { transform: scale(2.5) translateX(-80px) translateY(-20px); opacity: 0; }
    }

    .loading-text {
      color: #00e5ff;
      font-weight: bold;
      font-size: 1.1em;
      letter-spacing: 2px;
      margin-top: 10px;
      text-shadow: 0 0 10px rgba(0,229,255,0.6);
      animation: pulse-text 0.6s infinite alternate;
    }
    @keyframes pulse-text {
      to { opacity: 0.5; }
    }

    .hero-banner { background-color: #11052C; text-align: center; padding: 50px 20px; border-bottom: 3px solid #FF007F; box-shadow: 0 0 20px rgba(255, 0, 127, 0.4); position: relative; z-index: 2; }
    .hero-logo { max-width: 260px; margin-bottom: 15px; filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.1)); }
    .hero-title { font-size: 1.3em; font-weight: bold; margin-bottom: 20px; letter-spacing: 1px; text-shadow: 2px 2px 5px rgba(0,0,0,0.8); }
    
    .container { padding: 30px 20px; max-width: 1200px; margin: 0 auto; position: relative; z-index: 2; }
    .section-title { text-align: center; color: #FF007F; font-size: 1.8em; margin-bottom: 20px; animation: neon-pulse 1.5s infinite alternate; }
    @keyframes neon-pulse { 0% { text-shadow: 0 0 5px #FF007F, 0 0 10px #FF007F; } 100% { text-shadow: 0 0 5px #fff, 0 0 15px #FF007F, 0 0 30px #FF007F; } }
    
    .search-box { text-align: center; margin-bottom: 20px; }
    .search
