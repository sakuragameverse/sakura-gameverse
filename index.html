<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Gameverse</title>
  <style>
    body {
      margin: 0;
      background-color: #0d041a; /* Fondo aún más oscuro para mayor contraste */
    }
    .hero-banner {
      background-color: #11052C;
      color: white;
      text-align: center;
      padding: 60px 20px;
      border-bottom: 3px solid #FF007F;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
      font-family: sans-serif; 
    }
    .hero-logo {
      max-width: 280px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.1));
    }
    .hero-title {
      font-size: 1.4em;
      font-weight: bold;
      margin-bottom: 25px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
    }
    .btn-neon {
      background-color: transparent;
      color: #FF007F;
      border: 2px solid #FF007F;
      padding: 12px 30px;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 30px;
      text-transform: uppercase;
      box-shadow: 0 0 10px #FF007F inset, 0 0 15px #FF007F;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="hero-banner">
  <img src="logo.webp" alt="Sakura Gameverse" class="hero-logo">
  <div class="hero-title">
    Donde tu pasión por el gaming nunca hace game over. 👾🌸
  </div>
  <button class="btn-neon">Ver Catálogo</button>
</div>

</body>
</html>
