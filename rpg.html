<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro RPG | Sakura Gameverse</title>
  <link rel="icon" type="image/webp" href="logo.webp?v=2">
  <meta name="theme-color" content="#05010a">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="tienda.css">
  <link rel="stylesheet" href="rpg.css">
</head>
<body class="theme-rosa">

<!-- BARRA SUPERIOR DE NAVEGACIÓN RPG -->
<header class="admin-navbar" style="justify-content: space-between; padding: 10px 20px;">
  <div class="brand-box">
    <img src="logo.webp?v=2" class="brand-logo" alt="Logo">
    <span class="brand-title" style="color: var(--secondary-color);">Centro RPG & Paper Doll</span>
  </div>
  <div class="nav-actions">
    <a href="index.html" class="btn-nav btn-tienda" style="background: rgba(0, 229, 255, 0.1); border: 1px solid var(--secondary-color); color: var(--secondary-color);">
      <i class="fas fa-store"></i> Volver a la Tienda
    </a>
  </div>
</header>

<main class="container" style="max-width: 900px; padding-top: 20px; padding-bottom: 40px;">
  
  <!-- INFORMACIÓN DEL AVENTURERO -->
  <div class="card-panel" style="background: rgba(14, 4, 31, 0.85); border: 1px solid var(--secondary-color); border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0,229,255,0.15);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">
      <div>
        <h2 id="rpgPerfilTag" style="color: #fff; margin: 0; font-size: 1.4em;">GamerOtaku_VE</h2>
        <span style="font-size: 0.85em; color: var(--text-muted); text-transform: uppercase;">Clase: <strong id="rpgPerfilClase" style="color: var(--secondary-color);">Ninguna</strong></span>
      </div>
      <div>
        <span style="background: rgba(255,170,0,0.1); border: 1px solid rgba(255,170,0,0.3); padding: 6px 12px; border-radius: var(--radius-pill); color: #ffaa00; font-weight: bold;" id="rpgPerfilTokens">
          <i class="fas fa-coins"></i> 0 Tokens
        </span>
        <span style="background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.3); padding: 6px 12px; border-radius: var(--radius-pill); color: var(--secondary-color); font-weight: bold; margin-left: 6px;" id="rpgPerfilXp">
          0 XP
        </span>
      </div>
    </div>

    <!-- ATRIBUTOS Y ESTADÍSTICAS -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; background: rgba(0,0,0,0.4); padding: 12px; border-radius: var(--radius-sm); border: 1px dashed var(--glass-border);">
      <div>
        <div style="font-size: 0.75em; color: var(--text-muted);">VIDA (HP)</div>
        <div id="rpgStatHp" style="font-size: 1.2em; font-weight: bold; color: #ff3366;">100</div>
      </div>
      <div>
        <div style="font-size: 0.75em; color: var(--text-muted);">ATAQUE (ATK)</div>
        <div id="rpgStatAtk" style="font-size: 1.2em; font-weight: bold; color: #ffaa00;">10</div>
      </div>
      <div>
        <div style="font-size: 0.75em; color: var(--text-muted);">DEFENSA (DEF)</div>
        <div id="rpgStatDef" style="font-size: 1.2em; font-weight: bold; color: #00e5ff;">5</div>
      </div>
    </div>
  </div>

  <!-- INTERFAZ PAPER DOLL (MUÑECA DE PAPEL) -->
  <div class="card-panel" style="background: rgba(14, 4, 31, 0.85); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px; text-align: center;">
    <h3 style="color: var(--secondary-color); margin-top: 0; margin-bottom: 15px;"><i class="fas fa-user-ninja"></i> Panel de Equipamiento (Paper Doll)</h3>
    <p style="font-size: 0.85em; color: var(--text-muted); margin-bottom: 20px;">Haz clic en cualquier ranura para desequipar el objeto correspondiente.</p>
    
    <!-- Cuadrícula de 9 Ranuras -->
    <div id="paperDollGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 400px; margin: 0 auto;">
      <!-- Se llenará dinámicamente desde el script -->
    </div>
  </div>

  <!-- MOCHILA E INVENTARIO -->
  <div class="card-panel" style="background: rgba(14, 4, 31, 0.85); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="color: #fff; margin: 0;"><i class="fas fa-backpack"></i> Mochila e Inventario</h3>
      <span style="font-size: 0.85em; color: #00e5ff;"><i class="fas fa-gem"></i> Materiales: <strong id="rpgTotalMateriales">0</strong></span>
    </div>
    <div id="rpgContenedorInventario" class="rpg-grid">
      <!-- Se llenará dinámicamente desde el script -->
    </div>
  </div>

  <!-- ACCESOS RÁPIDOS A ACTIVIDADES (GIMNASIO, FORJA, MAZMORRAS) -->
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;">
    <button class="btn-comprar" style="margin: 0; background: linear-gradient(135deg, #ffaa00, #ff5500); padding: 14px;" onclick="location.href='index.html'">
      <i class="fas fa-dumbbell"></i> Ir al Gimnasio (Tienda)
    </button>
    <button class="btn-comprar" style="margin: 0; background: linear-gradient(135deg, #00e5ff, #0099ff); color: #000; padding: 14px;" onclick="location.href='index.html'">
      <i class="fas fa-hammer"></i> Ir a la Fragua (Tienda)
    </button>
    <button class="btn-comprar" style="margin: 0; background: linear-gradient(135deg, #b000ff, #ff007f); padding: 14px;" onclick="location.href='index.html'">
      <i class="fas fa-dungeon"></i> Explorar Mazmorras (Tienda)
    </button>
  </div>

</main>

<!-- Archivo de lógica dedicado al RPG -->
<script type="module" src="rpg.js"></script>
</body>
</html>
