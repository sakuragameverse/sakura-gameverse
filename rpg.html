<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro RPG | Sakura Gameverse</title>
  <link rel="icon" type="image/webp" href="logo.webp?v=2">
  <meta name="theme-color" content="#05010a">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="tienda.css">
  <link rel="stylesheet" href="rpg.css">
</head>
<body class="theme-rosa">

<!-- BARRA SUPERIOR -->
<header class="admin-navbar" style="justify-content: space-between; padding: 10px 20px;">
  <div class="brand-box" style="display: flex; align-items: center; gap: 10px;">
    <img src="logo.webp?v=2" class="brand-logo" alt="Logo" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
    <span class="brand-title" style="color: var(--secondary-color); font-size: 1.1em;">Centro RPG</span>
  </div>
  <div class="nav-actions">
    <a href="index.html" class="btn-nav btn-tienda" style="background: rgba(0, 229, 255, 0.1); border: 1px solid var(--secondary-color); color: var(--secondary-color); padding: 6px 12px; border-radius: var(--radius-pill); font-size: 0.85em; text-decoration: none;">
      <i class="fas fa-store"></i> Tienda
    </a>
  </div>
</header>

<main style="max-width: 500px; width: 92%; margin: 20px auto; padding-bottom: 40px;">
  
  <!-- INFORMACIÓN DEL AVENTURERO Y STATS -->
  <div class="card-panel" style="background: rgba(14, 4, 31, 0.85); border: 1px solid var(--secondary-color); border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0,229,255,0.15);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">
      <div>
        <h2 id="rpgPerfilTag" style="color: #fff; margin: 0; font-size: 1.3em;">GamerOtaku_VE</h2>
        <span style="font-size: 0.8em; color: var(--text-muted); text-transform: uppercase;">Clase: <strong id="rpgPerfilClase" style="color: var(--secondary-color);">Ninguna</strong></span>
      </div>
      <div>
        <span style="background: rgba(255,170,0,0.1); border: 1px solid rgba(255,170,0,0.3); padding: 5px 10px; border-radius: var(--radius-pill); color: #ffaa00; font-weight: bold; font-size: 0.85em;" id="rpgPerfilTokens">
          <i class="fas fa-coins"></i> 0 Tokens
        </span>
        <span style="background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.3); padding: 5px 10px; border-radius: var(--radius-pill); color: var(--secondary-color); font-weight: bold; font-size: 0.85em; margin-left: 4px;" id="rpgPerfilXp">
          0 XP
        </span>
      </div>
    </div>

    <!-- ATRIBUTOS Y GIMNASIO -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; background: rgba(0,0,0,0.4); padding: 10px; border-radius: var(--radius-sm); border: 1px dashed var(--glass-border);">
      <div>
        <div style="font-size: 0.7em; color: var(--text-muted);">HP</div>
        <div id="rpgStatHp" style="font-size: 1.1em; font-weight: bold; color: #ff3366;">100</div>
        <button onclick="entrenarStatRPG('hp')" style="margin-top: 4px; background: rgba(255,51,102,0.15); border: 1px solid rgba(255,51,102,0.4); color: #ff3366; border-radius: 4px; padding: 2px 6px; font-size: 0.7em; cursor: pointer;">+10 Tok</button>
      </div>
      <div>
        <div style="font-size: 0.7em; color: var(--text-muted);">ATK</div>
        <div id="rpgStatAtk" style="font-size: 1.1em; font-weight: bold; color: #ffaa00;">10</div>
        <button onclick="entrenarStatRPG('atk')" style="margin-top: 4px; background: rgba(255,170,0,0.15); border: 1px solid rgba(255,170,0,0.4); color: #ffaa00; border-radius: 4px; padding: 2px 6px; font-size: 0.7em; cursor: pointer;">+10 Tok</button>
      </div>
      <div>
        <div style="font-size: 0.7em; color: var(--text-muted);">DEF</div>
        <div id="rpgStatDef" style="font-size: 1.1em; font-weight: bold; color: #00e5ff;">5</div>
        <button onclick="entrenarStatRPG('def')" style="margin-top: 4px; background: rgba(0,229,255,0.15); border: 1px solid rgba(0,229,255,0.4); color: #00e5ff; border-radius: 4px; padding: 2px 6px; font-size: 0.7em; cursor: pointer;">+10 Tok</button>
      </div>
    </div>
  </div>

  <!-- PANEL DE EQUIPAMIENTO (PAPER DOLL SILUETA) -->
  <div class="card-panel" style="background: rgba(14, 4, 31, 0.85); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: 18px; margin-bottom: 20px; text-align: center;">
    <h3 style="color: var(--secondary-color); margin-top: 0; margin-bottom: 12px; font-size: 1.1em;"><i class="fas fa-user-ninja"></i> Paper Doll (Silueta)</h3>
    <div id="paperDollGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto;"></div>
  </div>

  <!-- MOCHILA E INVENTARIO -->
  <div class="card-panel" style="background: rgba(14, 4, 31, 0.85); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: 18px; margin-bottom: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="color: #fff; margin: 0; font-size: 1.1em;"><i class="fas fa-backpack"></i> Mochila</h3>
      <span style="font-size: 0.8em; color: #00e5ff;"><i class="fas fa-gem"></i> Materiales: <strong id="rpgTotalMateriales">0</strong></span>
    </div>
    <div id="rpgContenedorInventario" class="rpg-grid"></div>
  </div>

  <!-- EL GREMIO (CAZA, MINERÍA Y MAZMORRAS) -->
  <div class="card-panel" style="background: rgba(14, 4, 31, 0.85); border: 1px solid #25d366; border-radius: var(--radius-md); padding: 18px; margin-bottom: 20px;">
    <h3 style="color: #25d366; margin-top: 0; margin-bottom: 10px; font-size: 1.1em;"><i class="fas fa-campground"></i> Tablón del Gremio</h3>
    <div style="background: rgba(0,0,0,0.4); padding: 10px; border-radius: var(--radius-sm); border: 1px dashed #25d366; margin-bottom: 12px; text-align: center;">
      <div id="rpgResultadoGremio" style="font-size: 0.85em; color: #fff;">Elige tu misión diaria, aventurero.</div>
    </div>
    <div style="display: flex; gap: 8px; margin-bottom: 12px;">
      <button class="btn-comprar" style="margin-top: 0; background: linear-gradient(135deg, #ffaa00, #ff5500); font-size: 0.85em; padding: 10px;" onclick="accionCazaMinas('cazar')"><i class="fas fa-crosshairs"></i> Cazar</button>
      <button class="btn-comprar" style="margin-top: 0; background: linear-gradient(135deg, #00e5ff, #0099ff); color: #000; font-size: 0.85em; padding: 10px;" onclick="accionCazaMinas('minar')"><i class="fas fa-hammer"></i> Minar</button>
    </div>
    <div style="font-size: 0.8em; color: var(--text-muted); margin-bottom: 6px; font-weight: bold;">Mazmorras de Expedición:</div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <button class="btn-comprar" style="margin-top:0; background: rgba(0, 229, 255, 0.1); border: 1px solid #00e5ff; color: #00e5ff; box-shadow:none; font-size: 0.8em; padding: 8px;" onclick="entrarMazmorraRPG('facil')">🌲 Bosque Slime (Baja)</button>
      <button class="btn-comprar" style="margin-top:0; background: rgba(176, 0, 255, 0.1); border: 1px solid #b000ff; color: #b000ff; box-shadow:none; font-size: 0.8em; padding: 8px;" onclick="entrarMazmorraRPG('media')">🦇 Cueva Sangrienta (Media)</button>
      <button class="btn-comprar" style="margin-top:0; background: rgba(255, 51, 102, 0.1); border: 1px solid #ff3366; color: #ff3366; box-shadow:none; font-size: 0.8em; padding: 8px;" onclick="entrarMazmorraRPG('dificil')">🐉 Torre del Dragón (Brutal)</button>
    </div>
  </div>

  <!-- LA FRAGUA (CRAFTEO) -->
  <div class="card-panel" style="background: rgba(14, 4, 31, 0.85); border: 1px solid #ffaa00; border-radius: var(--radius-md); padding: 18px;">
    <h3 style="color: #ffaa00; margin-top: 0; margin-bottom: 10px; font-size: 1.1em;"><i class="fas fa-fire"></i> La Fragua</h3>
    <div id="listaRecetasFragua" style="display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto;">
      <p style="color: var(--text-muted); font-size: 0.85em; text-align: center;">Cargando recetas...</p>
    </div>
  </div>

</main>

<script type="module" src="rpg.js"></script>
</body>
</html>
